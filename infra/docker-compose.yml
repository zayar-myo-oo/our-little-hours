services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ourlittlehours}
      POSTGRES_USER: ${POSTGRES_USER:-olh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olh_local_dev}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olh}"]
      interval: 5s
      retries: 10
  api:
    build: ../apps/api
    profiles: ["api"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ourlittlehours}
      POSTGRES_USER: ${POSTGRES_USER:-olh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olh_local_dev}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  pgdata:
